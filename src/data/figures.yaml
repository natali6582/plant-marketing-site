# Every number that appears anywhere in the knowledge hub lives here, once.
#
# Articles never type a figure inline. They reference a key — <Figure id="..."/>
# or <KeyFigures ids={[...]}/> — and the component renders the value, its year
# and a link to the figures page. That is what makes "update once in January"
# true: one edit here changes every article that cites the number.
#
# Fields
#   value   the number itself, or a date string for a deadline
#   unit    "₪" | "%" | "שנים" | "גיל" | "חודשים" | "" (a bare count) | "תאריך"
#   year    the tax year or the year the figure is stated for. Required.
#   label   what the number IS, in the words an article would use
#   note    optional caveat that must travel with the number wherever it appears
#   group   which section of /knowledge/figures-<year>/ it belongs to
#   source  { label, url, tier }
#
# tier 1  primary — gov.il, רשות ניירות ערך, רשות המסים, בנק ישראל, הבורסה,
#         נבו / ויקיטקסט. The only tier that may be cited as authority.
# tier 2  explanatory — insurers, professional sites. Allowed only beside a
#         tier-1 source for the same fact.
# tier 0  NOT YET VERIFIED. The build refuses to publish an article that cites a
#         tier-0 figure; it is allowed only while the article is draft: true.
#
# The source policy, from the previews Natali supplied on 04/09:
#
#   tier 1  רשות שוק ההון (gov.il) · רשות ניירות ערך (isa.gov.il) · רשות המסים ·
#           בנק ישראל · הבורסה לניירות ערך בתל אביב (tase.co.il) · חוקים ותקנות
#           ב-Nevo ובוויקיטקסט. These verify regulatory and numeric facts.
#   tier 2  חברות ביטוח (הראל, מיטב, הפניקס) · אתרי מקצוע (כל-זכות, ויקיפדיה,
#           אנליסט, גלובס, כלכליסט). Useful to explain and illustrate; must be
#           verified against a tier-1 source before publication.
#   never   Plan-T's own internal material — system mapping, the content topic
#           bank, the pension training course, control reports. Context and
#           internal terminology only; never cited as a source.
#
# The policy also names the figures that must be re-verified close to
# publication and are index-linked annually: every ceiling for קרן השתלמות,
# קופת גמל, גמל להשקעה and פנסיה, the accredited-investor threshold, and the
# minimum pension for תיקון 190. That is most of this file.
#
# Everything below is tier 0 today, and that is deliberate rather than lazy.
# The research document these came from cites its sources as bare markers —
# "gov+1", "isa+1", "knesset+1", "boi", "tase+1" — with no URLs anywhere in the
# file. Writing plausible gov.il links would be inventing sources for regulated
# financial figures, so every entry carries the organisation the marker names
# and waits for the real link. scripts/check-figures.mjs lists them.

