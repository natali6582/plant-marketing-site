tikun-190-tax-rate:
  value: 15
  unit: "%"
  year: 2026
  label: מס על מרכיב הרווח היחסי בהיוון קצבה מוכרת
  # Narrower than the label we carried. The statute taxes only the מרכיב
  # הרווח היחסי — a defined fraction — not "the nominal profit" at large, and
  # only the part that is not already exempt under 9א(ה)(1).
  note: 'מצוטט מסעיף 9א(ה)(3) לפקודה: "על סכום שהתקבל עקב היוון קצבה מוכרת, אשר אינו פטור ממס לפי פסקה (1), יוטל מס רק בשל מרכיב הרווח היחסי, בשיעור של 15%". השיעור אינו מתעדכן שנתית.'
  group: tikun-190
  source: { label: "פקודת מס הכנסה — ויקיטקסט, סעיף 9א(ה)(3)", url: "https://he.wikisource.org/wiki/פקודת_מס_הכנסה", tier: 1 }

capital-gains-real:
  value: 25
  unit: "%"
  year: 2026
  label: השיעור המרבי על רווח הון ריאלי ליחיד
  # The statute sets a CAP, not a flat rate: "בשיעור שלא יעלה על 25%". The
  # label says so, because "מס של 25%" is a different claim from what the law
  # actually says. Section 91 also sets 30% for a בעל מניות מהותי.
  note: 'מצוטט מסעיף 91(ב)(1): "יחיד יהיה חייב במס על רווח הון ריאלי כאמור בסעיף 121, בשיעור שלא יעלה על 25%, ויראו את רווח ההון כשלב הגבוה ביותר בסולם הכנסתו החייבת". סעיף 91(ב)(2) קובע 30% לבעל מניות מהותי. השיעור אינו מתעדכן שנתית.'
  group: tax
  source: { label: "פקודת מס הכנסה, סעיף 91 — ויקיטקסט", url: "https://he.wikisource.org/wiki/פקודת_מס_הכנסה", tier: 1 }

capital-gains-nominal-unlinked:
  value: 15
  unit: "%"
  year: 2026
  label: השיעור המרבי על רווח הון באיגרת חוב או הלוואה שאינן צמודות למדד
  # The old label — "הכנסה נומינלית לא-צמודה" — was looser than the statute.
  # The rate attaches to specific instruments, not to nominal income at large.
  note: 'מצוטט מסעיף 91(ב)(3)(א): "רווח הון במכירת איגרת חוב, נייר ערך מסחרי, מילווה או הלוואה, שאינם צמודים למדד, יחויב במס בשיעור שלא יעלה על 15%, או של 20% לענין בעל מניות מהותי". השיעור אינו מתעדכן שנתית.'
  group: tax
  source: { label: "פקודת מס הכנסה, סעיף 91 — ויקיטקסט", url: "https://he.wikisource.org/wiki/פקודת_מס_הכנסה", tier: 1 }

