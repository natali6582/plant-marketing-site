tikun-190-first-tier:
  value: 38412
  unit: "₪"
  year: 2026
  label: 'תקרת ההפקדה המוטבת לעצמאי לפי סעיפים 45א ו-47 (מכונה בשוק ״הרובד הראשון״)'
  # DERIVED, and the derivation is not the one the brief described. The brief
  # said to cite "chapter ג, the 232,800 line" of the רשות המסים booklet.
  # There is no such line — 232,800 appears nowhere in the 2026 booklet.
  # What the booklet does carry is 19,400 ₪ לחודש for
  # "תקרת הסכום לזיכוי בעד דמי ביטוח ותגמולים 45א(ה)(2)", and 19,400 × 12
  # is exactly 232,800. That is the tier-1 anchor, and it is the one named
  # in the note. 16.5% × 232,800 = 38,412; 11% = 25,608 and 5.5% = 12,804.
  # Checked while here: the booklet's "עמית מוטב 47(א)(7)" row is 26,436 ₪
  # לשנה (= 16% × 13,769 × 12), a minimum deposit, not an income ceiling.
  note: 'סכום נגזר: 16.5% מתקרת הכנסה שנתית של 232,800 ₪ — שהיא פי 12 מתקרת 45א(ה)(2) שבלוח העזר, 19,400 ₪ לחודש. הסכום מתפצל ל-25,608 ₪ בניכוי (11%) ול-12,804 ₪ בזיכוי (5.5%). התקרה השנתית עצמה אינה מופיעה כשורה בלוח.'
  group: tikun-190
  source: { label: "רשות המסים — לוח עזר לחישוב מס הכנסה ממשכורת ושכר עבודה, ינואר 2026, מעודכן לאפריל 2026, פרק ג (שורת 45א(ה)(2)) — סכום נגזר", url: "https://www.gov.il/BlobFolder/generalpage/income-tax-monthly-deductions-booklet/he/generalInformation_income-tax-monthly-deductions-booklet_monthly-deductions-booklet-2026.pdf", tier: 1 }

